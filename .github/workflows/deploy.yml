# GitHub Pages 배포 — main 브랜치에 푸시되면 Astro를 빌드해 Pages에 올린다.
# 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions"로 바꿔야 동작한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    name: 토큰 규율 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run tokens:lint

  build:
    name: Astro 빌드
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install, build, and upload
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    name: Pages 배포
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  lighthouse:
    name: Lighthouse (배포 주소, 참고용)
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ needs.deploy.outputs.page_url }}
            ${{ needs.deploy.outputs.page_url }}projects/ds-monitor/
          uploadArtifacts: true
          temporaryPublicStorage: false
          runs: 1
